name: paystack_flutter_sdk
description: "Paystack Flutter SDK with support for multiple channels to accept payments from your customers in supported regions."
version: 0.0.1-alpha.2
homepage: https://paystack.com
repository: https://github.com/PaystackOSS/paystack_flutter
issue_tracker: https://github.com/PaystackOSS/paystack_flutter/issues
documentation: https://paystack.com/docs
topics: [paystack, payments, cards, mpesa]
publish_to: "none"

environment:
  sdk: '>=3.3.0 <4.0.0' 
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  paystack_flutter_web:
    git:
      url: https://github.com/disparta/paystack_flutter_web.git
      ref: main
  paystack_flutter_platform_interface:
    git:
      url: https://github.com/disparta/paystack_flutter_platform_interface.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.2

flutter:
  plugin:
    platforms:
      android:
        package: com.paystack.paystack_sdk
        pluginClass: PaystackSDKPlugin
      ios:
        pluginClass: PaystackSDKPlugin
      web:
        default_package: paystack_web